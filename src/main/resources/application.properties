spring.application.name=Janus

server.port=${SERVER_PORT:5000}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/janus}
spring.datasource.username=${DB_USER:${POSTGRES_USER:janus}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:janus}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

springdoc.swagger-ui.path=/swagger

# JWT custom compartilhado com a Auth API
security.jwt.secret=${JWT_SECRET:change-me-with-32-chars-minimum-secret}
security.jwt.system-id=${SYSTEM_ID:00000000-0000-0000-0000-000000000000}

# Origem(s) permitidas para CORS (lista separada por virgula)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:63342}
