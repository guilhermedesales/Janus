services:
  janus-db:
    image: postgres:16-alpine
    container_name: janus-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janus}
      POSTGRES_USER: ${POSTGRES_USER:-janus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janus}
    ports:
      - "5432:5432"
    volumes:
      - janus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-janus} -d ${POSTGRES_DB:-janus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  janus-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janus-app
    depends_on:
      janus-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER_PORT: 5000
      DB_URL: jdbc:postgresql://janus-db:5432/${POSTGRES_DB:-janus}
      DB_USER: ${POSTGRES_USER:-janus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-janus}
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  janus_db_data:

